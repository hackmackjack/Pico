<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Pico Blockly V2 — Ultimate</title>

  <!-- Core Blockly -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/python_compressed.js"></script>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    #left {
      width: 65%;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      background: #2c3e50;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    #blocklyDiv {
      flex: 1;
      min-height: 400px;
      background: #f0f0f0;
    }

    #right {
      width: 35%;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      color: #dcdcdc;
    }

    .code-header {
      padding: 10px;
      background: #252526;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      resize: none;
      background: #1e1e1e;
      color: #9cdcfe;
      border: none;
      padding: 12px;
      font-family: 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }

    .toolbar {
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #252526;
    }

    button {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.primary {
      background: #007acc;
      color: white;
    }

    button.secondary {
      background: #3e3e42;
      color: #fff;
    }

    #errors {
      height: 100px;
      background: #2d2d30;
      color: #f48771;
      font-family: monospace;
      padding: 10px;
      font-size: 12px;
      overflow: auto;
      border-top: 1px solid #333;
      display: none;
    }
  </style>
</head>

<body>
  <div class="app">
    <div id="left">
      <header>
        <h1>Pico Blockly V2 (Ultimate)</h1>
        <div style="flex:1"></div>
        <button class="secondary" id="exportBtn">Save XML</button>
        <button class="secondary" id="loadBtn" onclick="document.getElementById('fileInput').click()">Load XML</button>
        <input type="file" id="fileInput" style="display:none" accept=".xml">
        <button class="secondary" id="clearBtn">Clear</button>
      </header>
      <div id="blocklyDiv"></div>
      <div id="errors"></div>
    </div>

    <div id="right">
      <div class="code-header">
        <span>MicroPython Code</span>
        <span style="opacity:0.6">main.py</span>
      </div>
      <textarea id="codeArea" readonly spellcheck="false"></textarea>
      <div class="toolbar">
        <button class="primary" id="copyBtn">Copy Code</button>
        <button class="primary" id="downloadBtn">Download .py</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ----------------------------------------------------------------------
      // 1. UTILITIES & INIT
      // ----------------------------------------------------------------------
      const errorsEl = document.getElementById("errors");
      function logError(msg) {
        errorsEl.style.display = "block";
        errorsEl.innerText = "[Log] " + msg + "\n" + errorsEl.innerText;
        console.log(msg);
      }

      if (!Blockly.Python) {
        Blockly.Python = new Blockly.Generator("Python");
        Blockly.Python.ORDER_ATOMIC = 0;
        Blockly.Python.ORDER_FUNCTION_CALL = 1;
      }

      // ----------------------------------------------------------------------
      // 2. BLOCK DEFINITIONS
      // ----------------------------------------------------------------------
      Blockly.defineBlocksWithJsonArray([
        // --- IO & BASICS ---
        {
          "type": "pico_forever",
          "message0": "forever do %1",
          "args0": [{ "type": "input_statement", "name": "DO" }],
          "previousStatement": null, "colour": 120,
          "tooltip": "Runs the code inside repeatedly."
        },
        {
          "type": "pico_try_except",
          "message0": "Try %1 %2 On Error %3 %4",
          "args0": [
            { "type": "input_dummy" },
            { "type": "input_statement", "name": "TRY" },
            { "type": "input_dummy" },
            { "type": "input_statement", "name": "EXCEPT" }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 0,
          "tooltip": "Safely runs code. If an error happens, runs the 'On Error' section."
        },
        {
          "type": "pico_wait",
          "message0": "wait %1 %2",
          "args0": [
            { "type": "field_number", "name": "VAL", "value": 1, "min": 0, "tooltip": "Pauses the program for a specific amount of time." },
            { "type": "field_dropdown", "name": "UNIT", "options": [["seconds", "s"], ["milliseconds", "ms"], ["microseconds", "us"]] }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 160
        },
        {
          "type": "pico_run_delay",
          "message0": "Run After %1 s (Non-Blocking) %2",
          "args0": [
            { "type": "field_number", "name": "SEC", "value": 1 },
            { "type": "input_statement", "name": "DO" }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 160,
          "tooltip": "Runs the code after N seconds without pausing the main program."
        },
        {
          "type": "pico_stopwatch_ctrl",
          "message0": "Stopwatch %1",
          "args0": [{ "type": "field_dropdown", "name": "OP", "options": [["Start", "START"], ["Stop", "STOP"], ["Reset", "RESET"]] }],
          "previousStatement": null, "nextStatement": null, "colour": 160
        },
        {
          "type": "pico_stopwatch_get",
          "message0": "Stopwatch Seconds",
          "output": "Number", "colour": 160
        },
        {
          "type": "pico_neopixel_brightness",
          "message0": "NeoPixel Brightness (0-1.0) %1 Pin %2",
          "args0": [{ "type": "field_number", "name": "BRT", "value": 0.5 }, { "type": "field_number", "name": "PIN", "value": 28 }],
          "previousStatement": null, "nextStatement": null, "colour": 230, "tooltip": "Scales the brightness of the existing pixels. Note: This permanently modifies the pixel data."
        },
        {
          "type": "pico_log",
          "message0": "log/print %1",
          "args0": [{ "type": "input_value", "name": "MSG", "tooltip": "Prints a message to the Serial Console (Repl)." }],
          "previousStatement": null, "nextStatement": null, "colour": 160
        },
        {
          "type": "pico_gpio_write",
          "message0": "set Pin %1 to %2",
          "args0": [
            { "type": "field_number", "name": "PIN", "value": 25, "tooltip": "Sets a digital pin to High (3.3V) or Low (0V)." },
            { "type": "field_dropdown", "name": "STATE", "options": [["HIGH (1)", "1"], ["LOW (0)", "0"], ["TOGGLE", "TOGGLE"]] }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 120
        },
        {
          "type": "pico_smooth",
          "message0": "Smooth/Average %1 Samples %2",
          "args0": [
            { "type": "input_value", "name": "VAL" },
            { "type": "field_number", "name": "CNT", "value": 10 }
          ],
          "output": "Number", "colour": 120, "tooltip": "Calculates the average of N readings to reduce noise."
        },
        {
          "type": "pico_gpio_read",
          "message0": "read %1 Pin %2",
          "args0": [
            { "type": "field_dropdown", "name": "TYPE", "options": [["Digital (0/1)", "DIGITAL"], ["Analog (u16)", "ANALOG"], ["Voltage (0-3.3V)", "VOLT"]], "tooltip": "Reads the state (0/1), raw value (0-65535), or voltage (0-3.3V) of a pin." },
            { "type": "field_number", "name": "PIN", "value": 0 }
          ],
          "output": "Number", "colour": 120
        },
        {
          "type": "pico_pwm",
          "message0": "PWM Pin %1 %2 %3",
          "args0": [
            { "type": "field_number", "name": "PIN", "value": 0, "tooltip": "Controls LED brightness or motor speed using PWM." },
            { "type": "field_dropdown", "name": "OP", "options": [["Set Freq (Hz)", "FREQ"], ["Set Duty (u16)", "DUTY"], ["Set Duty (%)", "PCT"]] },
            { "type": "input_value", "name": "VAL" }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 120
        },

        // --- SENSORS (Expanded) ---
        {
          "type": "pico_rtc_init",
          "message0": "Setup RTC (DS3231) SDA %1 SCL %2",
          "args0": [{ "type": "field_number", "name": "SDA", "value": 0 }, { "type": "field_number", "name": "SCL", "value": 1 }],
          "previousStatement": null, "nextStatement": null, "colour": 200
        },
        {
          "type": "pico_rtc_get",
          "message0": "Get RTC Time (HH:MM:SS)",
          "output": "String", "colour": 200
        },
        {
          "type": "pico_rtc_set",
          "message0": "Set RTC Time H %1 M %2 S %3",
          "args0": [
            { "type": "field_number", "name": "H", "value": 12 }, { "type": "field_number", "name": "M", "value": 0 }, { "type": "field_number", "name": "S", "value": 0 }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 200
        },
        {
          "type": "pico_eeprom_write",
          "message0": "EEPROM Write Addr %1 Val %2",
          "args0": [{ "type": "input_value", "name": "ADDR" }, { "type": "input_value", "name": "VAL" }],
          "previousStatement": null, "nextStatement": null, "colour": 210
        },
        {
          "type": "pico_eeprom_read",
          "message0": "EEPROM Read Addr %1",
          "args0": [{ "type": "input_value", "name": "ADDR" }],
          "output": "Number", "colour": 210
        },
        {
          "type": "pico_button_debounce",
          "message0": "Button (Debounced) Pin %1",
          "args0": [{ "type": "field_number", "name": "PIN", "value": 15 }],
          "output": "Number", "colour": 200, "tooltip": "Reads a button press with software debounce (checks state twice)."
        },
        {
          "type": "pico_sensor_read",
          "message0": "read sensor %1 on Pin %2",
          "args0": [
            {
              "type": "field_dropdown", "name": "TYPE", "options": [
                // Environment
                ["DHT11 Temperature (C)", "DHT11_TEMP"],
                ["DHT11 Humidity (%)", "DHT11_HUM"],
                ["DHT22 Temperature (C)", "DHT22_TEMP"],
                ["DHT22 Humidity (%)", "DHT22_HUM"],
                ["DS18B20 Temp (C)", "DS18"],
                ["Gas Sensor (MQ)", "ANALOG"],
                ["Flame Sensor (Analog)", "ANALOG"],
                ["Flame Sensor (Digital)", "DIGITAL"],
                ["Sound (Analog Envelope)", "ANALOG"],
                ["Sound (Digital Trigger)", "DIGITAL"],
                ["Light (LDR/Photocell)", "ANALOG"],
                ["Thermistor (NTC)", "ANALOG"],
                ["Soil Moisture", "ANALOG"],
                ["Rain Level (Analog)", "ANALOG"],
                ["Water Level (Depth)", "ANALOG"],

                // Input/Mech
                ["Potentiometer / Slide", "ANALOG"],
                ["Joystick (Axis)", "ANALOG"],
                ["Flex / Bend Sensor", "ANALOG"],
                ["Force / Pressure (FSR)", "ANALOG"],
                ["Vibration / Shake", "DIGITAL"],
                ["Tilt Switch", "DIGITAL"],
                ["Reed Switch (Door)", "DIGITAL_PULLUP"],
                ["Touch Sensor", "DIGITAL"],
                ["Button (PullUp)", "DIGITAL_PULLUP"],
                ["Limit Switch", "DIGITAL_PULLUP"],
                ["Beam Break", "DIGITAL"],

                // Motion
                ["PIR Motion", "DIGITAL"],
                ["IR Obstacle", "DIGITAL"],
                ["Line Follower (IR)", "DIGITAL"],
                ["Hall Effect", "DIGITAL"]
              ], "tooltip": "Reads data from various sensors (DHT, Light, Moisture, etc)."
            },
            { "type": "field_number", "name": "PIN", "value": 15 }
          ],
          "output": "Number", "colour": 200
        },
        {
          "type": "pico_pulse_in",
          "message0": "Pulse In Pin %1 State %2 Timeout (us) %3",
          "args0": [
            { "type": "field_number", "name": "PIN", "value": 0 },
            { "type": "field_dropdown", "name": "STATE", "options": [["High (1)", "1"], ["Low (0)", "0"]] },
            { "type": "field_number", "name": "TIMEOUT", "value": 1000000 }
          ],
          "output": "Number", "colour": 200, "tooltip": "Measures the duration of a pulse in microseconds."
        },
        {
          "type": "pico_ir_read",
          "message0": "IR Remote Read Pin %1",
          "args0": [{ "type": "field_number", "name": "PIN", "value": 16 }],
          "output": "String", "colour": 200, "tooltip": "Reads NEC IR code (e.g. from TV remote)."
        },
        {
          "type": "pico_map",
          "message0": "Map %1 from %2-%3 to %4-%5",
          "args0": [
            { "type": "input_value", "name": "VAL" },
            { "type": "field_number", "name": "IL", "value": 0 }, { "type": "field_number", "name": "IH", "value": 65535 },
            { "type": "field_number", "name": "OL", "value": 0 }, { "type": "field_number", "name": "OH", "value": 100 }
          ],
          "output": "Number", "colour": 200, "tooltip": "Re-maps a number from one range to another."
        },
        {
          "type": "pico_median",
          "message0": "Median Filter %1",
          "args0": [{ "type": "input_value", "name": "VAL" }],
          "output": "Number", "colour": 200, "tooltip": "Returns the median of the last 5 values (removes spikes)."
        },
        {
          "type": "pico_math_stats",
          "message0": "List Stats %1 Data %2",
          "args0": [
            { "type": "field_dropdown", "name": "OP", "options": [["Average", "AVG"], ["Max", "MAX"], ["Min", "MIN"], ["Variance", "VAR"], ["Std Dev", "STD"]] },
            { "type": "input_value", "name": "LIST" }
          ],
          "output": "Number", "colour": 200
        },
        {
          "type": "pico_dict_new",
          "message0": "Create Dictionary (Empty)",
          "output": "Dictionary", "colour": 330
        },
        {
          "type": "pico_dict_get",
          "message0": "In Dict %1 Get Key %2",
          "args0": [{ "type": "input_value", "name": "DICT" }, { "type": "input_value", "name": "KEY" }],
          "output": null, "colour": 330
        },
        {
          "type": "pico_dict_set",
          "message0": "In Dict %1 Set Key %2 to %3",
          "args0": [{ "type": "input_value", "name": "DICT" }, { "type": "input_value", "name": "KEY" }, { "type": "input_value", "name": "VAL" }],
          "previousStatement": null, "nextStatement": null, "colour": 330
        },
        {
          "type": "pico_imu_get_angle",
          "message0": "IMU Angle %1 (Pitch/Roll) SDA %2 SCL %3",
          "args0": [
            { "type": "field_dropdown", "name": "AXIS", "options": [["Pitch", "0"], ["Roll", "1"]] },
            { "type": "field_number", "name": "SDA", "value": 0 },
            { "type": "field_number", "name": "SCL", "value": 1 }
          ],
          "output": "Number", "colour": 200, "tooltip": "Returns tilt angle using sensor fusion."
        },
        {
          "type": "pico_color_is",
          "message0": "Is Color %1 ? R %2 G %3 B %4",
          "args0": [
            { "type": "field_dropdown", "name": "COL", "options": [["Red", "RED"], ["Green", "GREEN"], ["Blue", "BLUE"]] },
            { "type": "input_value", "name": "R" }, { "type": "input_value", "name": "G" }, { "type": "input_value", "name": "B" }
          ],
          "output": "Boolean", "colour": 200
        },
        {
          "type": "pico_peak_detector",
          "message0": "Peak Detector %1 Value %2 ID %3 Reset %4",
          "args0": [
            { "type": "field_dropdown", "name": "MODE", "options": [["Max", "MAX"], ["Min", "MIN"]] },
            { "type": "input_value", "name": "VAL" },
            { "type": "field_number", "name": "ID", "value": 0 },
            { "type": "field_checkbox", "name": "RESET", "checked": false }
          ],
          "output": "Number", "colour": 200, "tooltip": "Tracks the highest (Max) or lowest (Min) value seen."
        },
        {
          "type": "pico_i2c_read_reg",
          "message0": "I2C Read Reg Dev %1 Reg %2 Bytes %3 Bus %4",
          "args0": [
            { "type": "input_value", "name": "ADDR" }, { "type": "input_value", "name": "REG" }, { "type": "field_number", "name": "LEN", "value": 1 },
            { "type": "field_dropdown", "name": "BUS", "options": [["0", "0"], ["1", "1"]] }
          ],
          "output": "Number", "colour": 200, "tooltip": "Reads a specific register from an I2C device."
        },
        {
          "type": "pico_i2c_write_reg",
          "message0": "I2C Write Reg Dev %1 Reg %2 Val %3 Bus %4",
          "args0": [
            { "type": "input_value", "name": "ADDR" }, { "type": "input_value", "name": "REG" }, { "type": "input_value", "name": "VAL" },
            { "type": "field_dropdown", "name": "BUS", "options": [["0", "0"], ["1", "1"]] }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 200, "tooltip": "Writes a value to a specific register on an I2C device."
        },
        {
          "type": "pico_distance",
          "message0": "Ultrasonic dist (cm) Trig %1 Echo %2",
          "args0": [
            { "type": "field_number", "name": "TRIG", "value": 14, "tooltip": "Measures distance in cm using an HC-SR04 ultrasonic sensor." },
            { "type": "field_number", "name": "ECHO", "value": 15 }
          ],
          "output": "Number", "colour": 200
        },
        {
          "type": "pico_i2c_sensor",
          "message0": "read I2C %1 %2 SDA %3 SCL %4",
          "args0": [
            {
              "type": "field_dropdown", "name": "SENSOR", "options": [
                ["MPU6050 (Accel/Gyro)", "MPU6050"],
                ["BMP280 (Temp/Press)", "BMP280"],
                ["VL53L0X (Distance)", "VL53L0X"],
                ["TCS34725 (Color)", "TCS34725"],
                ["BH1750 (Light)", "BH1750"]
              ], "tooltip": "Reads advanced data from I2C sensors like MPU6050 or BMP280."
            },
            {
              "type": "field_dropdown", "name": "DATA", "options": [
                ["Accel X", "AX"], ["Accel Y", "AY"], ["Accel Z", "AZ"],
                ["Gyro X", "GX"], ["Gyro Y", "GY"], ["Gyro Z", "GZ"],
                ["Temperature (C)", "TEMP"], ["Pressure (hPa)", "PRESS"],
                ["Distance (mm)", "DIST"],
                ["Red", "RED"], ["Green", "GREEN"], ["Blue", "BLUE"], ["Clear", "CLEAR"],
                ["Lux", "LUX"]
              ]
            },
            { "type": "field_number", "name": "SDA", "value": 0 },
            { "type": "field_number", "name": "SCL", "value": 1 }
          ],
          "output": "Number", "colour": 200
        },
        {
          "type": "pico_uart_gps",
          "message0": "GPS Read %1 ID %2 TX %3 RX %4",
          "args0": [
            {
              "type": "field_dropdown", "name": "DATA", "options": [
                ["Latitude", "LAT"], ["Longitude", "LON"], ["Satellites", "SAT"]
              ], "tooltip": "Reads location data from a GPS module."
            },
            { "type": "field_dropdown", "name": "ID", "options": [["0", "0"], ["1", "1"]] },
            { "type": "field_number", "name": "TX", "value": 0 }, { "type": "field_number", "name": "RX", "value": 1 }
          ],
          "output": "Number", "colour": 200
        },
        {
          "type": "pico_i2c_scan",
          "message0": "I2C Scan SDA %1 SCL %2",
          "args0": [{ "type": "field_number", "name": "SDA", "value": 0, "tooltip": "Scans the I2C bus and prints addresses of connected devices." }, { "type": "field_number", "name": "SCL", "value": 1 }],
          "previousStatement": null, "nextStatement": null, "colour": 200
        },
        {
          "type": "pico_uart_init",
          "message0": "Init UART ID %1 TX %2 RX %3 Baud %4",
          "args0": [
            { "type": "field_dropdown", "name": "ID", "options": [["0", "0"], ["1", "1"]], "tooltip": "Initializes a UART serial connection." },
            { "type": "field_number", "name": "TX", "value": 0 }, { "type": "field_number", "name": "RX", "value": 1 },
            { "type": "field_number", "name": "BAUD", "value": 9600 }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 200
        },
        {
          "type": "pico_uart_write",
          "message0": "UART %1 Write %2",
          "args0": [{ "type": "field_dropdown", "name": "ID", "options": [["0", "0"], ["1", "1"]], "tooltip": "Sends text data over UART." }, { "type": "input_value", "name": "DATA" }],
          "previousStatement": null, "nextStatement": null, "colour": 200
        },
        {
          "type": "pico_uart_read",
          "message0": "UART %1 Read Line",
          "args0": [{ "type": "field_dropdown", "name": "ID", "options": [["0", "0"], ["1", "1"]], "tooltip": "Reads a line of text from UART." }],
          "output": "String", "colour": 200
        },
        {
          "type": "pico_radio_init",
          "message0": "Radio Init Mode %1 Group %2",
          "args0": [
            { "type": "field_dropdown", "name": "MODE", "options": [["Host (Create)", "HOST"], ["Join", "JOIN"]] },
            { "type": "field_number", "name": "GRP", "value": 1 }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 200,
          "tooltip": "Setups WiFi Broadcast. Use same Group ID for all Picos."
        },
        {
          "type": "pico_radio_send",
          "message0": "Radio Send %1",
          "args0": [{ "type": "input_value", "name": "MSG" }],
          "previousStatement": null, "nextStatement": null, "colour": 200
        },
        {
          "type": "pico_radio_receive",
          "message0": "Radio Receive (String)",
          "output": "String", "colour": 200
        },
        {
          "type": "pico_spi_rfid",
          "message0": "RFID (SPI0) Read UID",
          "output": "String", "colour": 200
          , "tooltip": "Reads the UID tag from an RFID reader."
        },
        {
          "type": "pico_sd_init",
          "message0": "Init SD Card SPI1 SCK %1 MOSI %2 MISO %3 CS %4",
          "args0": [
            { "type": "field_number", "name": "SCK", "value": 10, "tooltip": "Mounts an SD card to the file system." }, { "type": "field_number", "name": "MOSI", "value": 11 },
            { "type": "field_number", "name": "MISO", "value": 12 }, { "type": "field_number", "name": "CS", "value": 13 }
          ],
          "previousStatement": null, "nextStatement": null, "colour": 0
        },
        {
          "type": "pico_sd_unmount",
          "message0": "Unmount SD Card",
          "previousStatement": null, "nextStatement": null, "colour": 0
          , "tooltip": "Safely unmounts the SD card."
        },

        // --- ACTUATORS ---
        {
          "type": "pico_servo",
          "message0": "Servo Pin %1 Angle %2",

class KNN:
    def __init__(self, k=3): self.k=k; self.data=[]
    def add(self, v, l): self.data.append((v,l))
    def dist(self, v1, v2): return sum([(a-b)**2 for a,b in zip(v1,v2)])
    def predict(self, v):
        if not self.data: return "?"
        s = sorted(self.data, key=lambda x: self.dist(v, x[0]))[:self.k]

    def __init__(self, u): self.u=u
    def crc(self, d):
        c=0xFFFF
        for b in d:
            c^=b
            for _ in range(8): c=(c>>1)^0xA001 if c&1 else c>>1
        return c.to_bytes(2,'little')
    def rw(self, a, f, r, v=0):
        req=bytes([a,f])+r.to_bytes(2,'big')+v.to_bytes(2,'big')
        self.u.write(req+self.crc(req))
        time.sleep(0.1)
        if self.u.any():

class SDCard:
    def __init__(self, spi, cs):
        self.spi = spi
        self.cs = cs
        self.cmdbuf = bytearray(6)
        self.dummybuf = bytearray(512)
        for i in range(512): self.dummybuf[i] = 0xFF
        self.dummybuf_memoryview = memoryview(self.dummybuf)
        self.init_card()
    def init_card(self):
        self.cs.init(self.cs.OUT, value=1)
        self.spi.init()
        for i in range(16): self.spi.write(b'\\xff')
        for _ in range(5):
            if self.cmd(0, 0, 0x95) == 1: break
        else: raise OSError("no SD card")
        r = self.cmd(8, 0x1aa, 0x87, False)
        if r == 1:
            self.init_card_v2()
        elif r == 0x05:
            self.init_card_v1()
        else: raise OSError("couldn't determine SD card version")
        if self.cmd(9, 0, 0, False) != 0: raise OSError("no CSD")
        if self.cmd(16, 512, 0) != 0: raise OSError("can't set 512 block size")
    def init_card_v1(self):
        for i in range(0, 1000):
            self.cmd(55, 0, 0)
            if self.cmd(41, 0, 0) == 0: return
        raise OSError("timeout waiting for v1 card")
    def init_card_v2(self):
        for i in range(0, 1000):
            time.sleep_ms(50)
            self.cmd(55, 0, 0)
            if self.cmd(41, 0x40000000, 0) == 0: return
        raise OSError("timeout waiting for v2 card")
    def cmd(self, cmd, arg, crc, release=True):
        self.cs(0)
        self.cmdbuf[0] = cmd | 0x40
        self.cmdbuf[1] = arg >> 24
        self.cmdbuf[2] = arg >> 16
        self.cmdbuf[3] = arg >> 8
        self.cmdbuf[4] = arg
        self.cmdbuf[5] = crc
        self.spi.write(self.cmdbuf)
        for i in range(100):
            r = self.spi.read(1, 0xFF)[0]
            if not (r & 0x80): break
        else: r = 0xFF
        if release: self.cs(1); self.spi.write(b'\\xff')
        return r
    def readblocks(self, block_num, buf):
        self.cs(0)
        if self.cmd(17, block_num, 0, release=False) != 0: self.cs(1); return 1
        for i in range(1000):
            if self.spi.read(1, 0xFF)[0] == 0xFE: break
        else: self.cs(1); return 1
        self.spi.readinto(buf, 0xFF)
        self.spi.read(2, 0xFF)
        self.cs(1); self.spi.write(b'\\xff')
        return 0

        const id = block.id.replace(/[^a-zA-Z0-9]/g, '');
        Blockly.Python.definitions_[`pid_${id}`] = `pid_${id} = PID(${kp},${ki},${kd})`;
        return [`pid_${id}.compute(${sp}, ${pv})`, Blockly.Python.ORDER_FUNCTION_CALL];
      };
      G["pico_keypad"] = function (block) {

        Blockly.Python.definitions_['kp_inst'] = `keypad = Keypad([${r.join(',')}], [${c.join(',')}])`;

      // ----------------------------------------------------------------------
      // 5. UPDATE
      // ----------------------------------------------------------------------
      function updateCode() {
        try {
          Blockly.Python.definitions_ = {};
          const body = Blockly.Python.workspaceToCode(workspace);
          let header = "# Pico Generated Code\nfrom machine import Pin, PWM, ADC, time_pulse_us\nimport time\n";
          for (let key in Blockly.Python.definitions_) {
            header += Blockly.Python.definitions_[key] + "\n";
          }
          document.getElementById("codeArea").value = header + "\n" + body;
          errorsEl.style.display = "none";
        } catch (e) {
          logError(e);
        }
      }
      workspace.addChangeListener(updateCode);
      updateCode();

      // ----------------------------------------------------------------------
      // 6. UI ACTIONS
      // ----------------------------------------------------------------------
      document.getElementById("copyBtn").onclick = () => {
        document.getElementById("codeArea").select();
        document.execCommand("copy");
        alert("Copied!");
      };
      document.getElementById("downloadBtn").onclick = () => {
        const b = new Blob([document.getElementById("codeArea").value], { type: "text/x-python" });
        const u = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = u; a.download = "main.py"; a.click();
      };
      document.getElementById("clearBtn").onclick = () => { if (confirm("Clear?")) workspace.clear(); };
      document.getElementById("exportBtn").onclick = () => {
        const xml = Blockly.Xml.workspaceToDom(workspace);
        const t = Blockly.Xml.domToPrettyText(xml);
        const b = new Blob([t], { type: "text/xml" });
        const u = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = u; a.download = "pico_v2.xml"; a.click();
      };
      document.getElementById("loadBtn").onclick = () => document.getElementById("fileInput").click();
      document.getElementById("fileInput").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const xml = Blockly.Xml.textToDom(ev.target.result);
          Blockly.Xml.domToWorkspace(xml, workspace);
        };
        reader.readAsText(file);
      };
